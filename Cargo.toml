[workspace]
resolver = "3"
members = ["crates/sync", "crates/core", "crates/app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/digistalter/kalender"
authors = ["Die Entwicklerinnen und Entwickler von Kalender"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
